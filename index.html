/* --- left-panel palette: EXACT tokens from the hitthe.link root page --- */
:root {
  --ink: #dffbe9; --accent: #3cff96; --alert: #ff4a4a;
  --dim: rgba(223, 251, 233, 0.45); --faint: rgba(223, 251, 233, 0.12);
  --bg: #000100; --panel: rgba(5, 12, 8, 0.55); --border: rgba(60, 255, 150, 0.15);
  /* --- center-panel palette: EXACT tokens from lifenote --- */
  --jade:#00FF7F; --resolve:#7CFF9B; --heavy:#6B7280; --luminous:#00FFC2; --restless:#F59E0B;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --emerald:#22d3a4;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- global frame ---------- */
.os{position:fixed;inset:0;display:flex;flex-direction:column}
.statusbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;
  font-size:11px;letter-spacing:.08em;color:var(--dim);
  border-bottom:1px solid var(--border);background:var(--panel);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.statusbar .live{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent)}
.statusbar .id{margin-left:auto;color:var(--accent)}

/* ---------- three panels ---------- */
.panes{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);
  gap:1px;background:var(--border);min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);overflow:hidden}
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--border)}
.pane-head .n{margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums}
.pane-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 12px;
  -webkit-overflow-scrolling:touch}

/* ---------- glass searchbar (left panel, per spec) ---------- */
.glass-search{flex:0 0 auto;margin:10px 12px;position:relative}
.glass-search input{width:100%;padding:10px 12px 10px 32px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);color:var(--ink);
  font:13px var(--mono);outline:none;
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.glass-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,255,150,.10)}
.glass-search input::placeholder{color:var(--dim)}
.glass-search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:13px;pointer-events:none}

/* ---------- rows ---------- */
.row{padding:9px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:.12s;margin-bottom:4px}
.row:hover{background:var(--panel);border-color:var(--border)}
.row .who{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .prev{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .net{font-size:9px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}

/* ---------- center: real note editor (lifenote palette) ---------- */
.note-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.note-tabs{flex:0 0 auto;display:flex;gap:2px;padding:6px 10px 0;overflow-x:auto}
.note-tab{padding:6px 12px;border-radius:9px 9px 0 0;border:1px solid var(--border);
  border-bottom:none;background:transparent;color:var(--dim);font:11px var(--mono);
  cursor:pointer;white-space:nowrap}
.note-tab.active{background:var(--panel);color:var(--jade)}
.note-title{flex:0 0 auto;padding:10px 14px 4px;font-size:16px;color:var(--ink);
  background:transparent;border:0;outline:none;font-family:var(--mono);width:100%}
.note-editor{flex:1 1 auto;width:100%;padding:8px 14px 14px;background:transparent;
  border:0;outline:none;resize:none;color:var(--ink);font:13px/1.7 var(--mono);min-height:0}
.note-status{flex:0 0 auto;padding:6px 14px;font-size:10px;color:var(--dim);
  border-top:1px solid var(--border);display:flex;gap:12px;align-items:center}
.note-status .dot{width:6px;height:6px;border-radius:50%;background:var(--heavy)}
.note-status .dot.saved{background:var(--resolve)}
.note-status .dot.dirty{background:var(--restless)}

/* ---------- right: emerald-glass call button ---------- */
.call-emerald{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;border:1px solid rgba(34,211,164,.42);
  background:linear-gradient(180deg,rgba(34,211,164,.22),rgba(34,211,164,.07));
  color:var(--emerald);font:13px/1 var(--mono);letter-spacing:.04em;cursor:pointer;
  backdrop-filter:blur(16px) saturate(1.7);-webkit-backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:0 0 0 1px rgba(34,211,164,.12) inset,0 8px 26px rgba(34,211,164,.16);
  transition:.14s}
.call-emerald:hover{border-color:rgba(34,211,164,.7);color:#7df3d0;
  box-shadow:0 0 0 1px rgba(34,211,164,.2) inset,0 10px 34px rgba(34,211,164,.28)}
.call-emerald:active{transform:scale(.97)}
.call-emerald:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}

/* ---------- OPHANIM: bottom-right, watching ---------- */
#ophanim{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  width:104px;height:104px;z-index:80;cursor:pointer;border-radius:50%;
  border:1px solid rgba(60,255,150,.18);background:rgba(2,8,5,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px rgba(60,255,150,.06) inset;
  transition:.2s}
#ophanim:hover{border-color:rgba(60,255,150,.45);transform:translateY(-2px)}
#ophanim canvas{width:100%;height:100%;display:block;border-radius:50%}
#ophanim .tag{position:absolute;left:0;right:0;bottom:-16px;text-align:center;
  font-size:8px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}

/* ---------- adapter status strip (honest about what is off) ---------- */
.adapters{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  z-index:70;display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--dim)}
.adapters b{font-weight:400}
.adapters .on{color:var(--accent)} .adapters .off{color:var(--heavy)}

@media (max-width:900px){
  .panes{grid-template-columns:100%;grid-auto-rows:1fr}
  .pane:not(.active){display:none}
  #ophanim{width:78px;height:78px}
}

  /* ⏪ REVERTED TO KNOWN-GOOD — qi 2026-08-13 21:39: "over 70% of my swipe glass
     vertically has been cut off" and "they cut my swipe glass AND kept the negative
     space." I traded a cosmetic gap for a broken glass; that is strictly worse, so the
     geometry goes back to the shape that was whole.

     I changed this twice in five minutes without ever seeing his device, and each guess
     produced a new defect. The gap is real and still needs fixing — but from a MEASURED
     screenshot of his handset, not from reasoning about env() values I cannot observe.
     A smaller known complaint beats a larger unknown one. */
  /* ✅ SETTLED WITH HIS OWN NUMBERS — qi's ?geo=1 readout, handset, 2026-08-13 22:41:
       viewport 402×812 · safe-area bottom=34px · --xos-dock-real=94px
       .dock.dock-swipe   718→812  h94        GAP dock→screen bottom = 0px
       #waveform-canvas   719→756  h37        ← pinned to the TOP of the glass
       .dock-notif-ticker ABSENT
     So the glass was ALWAYS at the bottom — every "the bar is too high" reading was
     wrong, mine included. What he was pointing at is the 56px of EMPTY GLASS below the
     wave: 812 − 756.

     WHY THE WAVE COULD NOT COME DOWN. This column reserves twice under a 37px wave:
       padding-bottom: 34px   (the inset)
     + margin-bottom: 22px    (--dock-notif-h, on .dock-vei-host, for the ticker)
     = 56px of reservation. 37 + 22 + 34 = 93 ≈ the glass's own 94px height, so the
     column is EXACTLY FULL and `justify-content: flex-end` has zero slack left to
     distribute. flex-end was never doing anything — the wave sat at the top because
     the padding pushed everything up against the ceiling, not because it was aligned
     there. That is why this looked like "the bar is too high" instead of what it is.

     THE INSET DOES NOT NEED PADDING HERE. min-height above already grows the glass by
     the inset, so the glass covers the home-indicator band with real glass — which is
     what he asked for: "bottom of the screen = swipe glass". Padding on top of that is
     a SECOND reservation for the same 34px, and it buys nothing because nothing in
     this column is at risk of the indicator: the ticker is absolutely positioned and
     the wave is decorative.

     Dropping it lets flex-end finally work: the wave falls 34px, its bottom lands 22px
     above the glass bottom, and the ticker (absolute, bottom:6px) sits in exactly that
     22px strip — inside the glass, at its bottom, directly under the wave. qi 22:40:
     "bottom of the swipe glass, not underneath — INSIDE the swipe glass equals the
     notification."

     Height-neutral by construction: min-height is untouched, so the glass stays 94px
     on his handset and 60.44px without an inset. Only the contents move down. */
  /* ⛔ SAFE AREA ZEROED — qi 2026-08-13 22:42, after reading his own ?geo=1 readout:
     "it says bottom 34 pixels and top zero pixels and that must be the issue" ...
     "It shouldn't be no fucking safe area at all — set the bottom to zero pixels like
     it was supposed to be."

     He diagnosed it off the probe himself and he is right: on his handset the inset was
     the ONLY thing between his design and the bottom of the screen. It grew the glass to
     94px and reserved 56px under a 37px wave, and every "the bar is too high" complaint
     traces back to that one number.

     --sab is the single knob. It is the value the whole bar's geometry reads, and it is
     deliberately a variable rather than a hardcoded 0 for two reasons: one line restores
     the inset if he ever wants it back, and a test can set it to 34px to reproduce his
     handset exactly — which is the only reason I could measure this at all, since every
     browser I can drive reports env(safe-area-inset-bottom) as 0 and therefore cannot
     show the bug.

     THE TRADE, stated plainly because it is real: with the inset at 0 the bottom of the
     glass sits under the home-indicator band. That is his explicit instruction, twice,
     and it is his product. */

  padding-bottom: var(--sab);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;}
.os.os-fullscreen .dock.dock-swipe .dock-vei-host{position: relative;
  z-index: 2;            /* above .dock-hit, which is the gesture layer */
  pointer-events: auto;  /* take back the events the hit layer claimed */
  flex: 0 0 auto;
  width: 100%;
  /* WAVE ON TOP, NOTIFICATIONS UNDERNEATH. qi 2026-08-13 21:52: "the sound wave and the
     notifications need to be vertically swapped."

     MEASURED live at 390x844 before this change:
       .dock.dock-swipe   y=785  h=59   bottom=844
       .dock-vei-host     y=806  h=37          <- occupies the dock's BOTTOM 37px
       .dock-notif-ticker position:absolute, bottom:calc(safe-area + 6px)
     They were not mis-ordered, they were STACKED: the host sits at the bottom because the
     column is justify-content:flex-end, and the ticker is absolutely pinned to that same
     bottom edge. Two things claiming one strip.

     The dock is 59px and the wave is 37px, so 22px above it is already unused. Reserving
     that height BELOW the host lifts the wave into space that already exists and leaves
     the bottom strip to the ticker — so the swap costs ZERO extra bar height. That matters
     because he told me at 21:38 the bar had grown and at 21:39 that the glass was cut;
     any fix that changes this bar's height is a regression regardless of what it fixes.

     Kept in sync with the ticker's own reservation via one variable so the two can never
     drift apart into an overlap again. */
  --dock-notif-h: 22px;
  margin-bottom: var(--dock-notif-h);}
/* The composer was position:absolute, anchored to the bottom of vvsvei's own
   viewport-sized wrap. In the glass it is simply IN FLOW — the glass is its
   container now, so it must not float relative to anything else. Its INTERNALS
   (#pill-row above .composer-bar) are untouched, which is what keeps the pills
   where qi put them and makes this 0% different. */
.os.os-fullscreen .dock.dock-swipe .dock-vei-host .composer{position: static;
  inset: auto;
  left: auto; right: auto; bottom: auto;
  padding: 6px 10px 0;
  width: 100%;}
/* Notifications stay at the BOTTOM of the bar, "like before" — the host renders
   above the ticker in the JSX, and this keeps the ticker hugging the bottom edge
   in the new column layout. */
.os.os-fullscreen .dock.dock-swipe .dock-notif-ticker{/* qi 2026-08-13 21:27-21:28: notifications sat at the TOP of the bar instead of the
     bottom, and ran past the right edge — "it needs to [stop] before it hits the other
     side ... the same width of where it starts on the left, on the right side."

     ONE CAUSE FOR BOTH. There are two rules for this element. The other one
     (`.os.os-fullscreen .dock-notif-ticker`, line ~3928) declares position:absolute with
     left:8% / right:8% / bottom:calc(...). THIS rule is more specific — it carries the
     extra `.dock.dock-swipe` — so its `position: relative` won.

     On a RELATIVE element those offsets change meaning completely: `left` SHIFTS the box
     rightward from its flow position and `right` is ignored outright (in LTR, left wins
     when both are set). So it began 8% in on the left, which read as correct, and
     overhung the right edge by that same 8%. And `bottom` does nothing in relative flow,
     so it landed wherever the column flex put it — the top — instead of at the bottom.

     Restoring absolute here lets the sibling rule's left/right/bottom apply as authored:
     symmetric 8% insets, pinned to the bottom. Scoped strictly to the notification —
     qi 21:28 "only in the notification". */
  position: absolute;
  z-index: 1;
  flex: 0 0 auto;}
/* Top-edge refraction highlight - 1px catching light from above */
.os.os-fullscreen .dock.dock-swipe .dock-sheen{position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  height: 1px;
  background: linear-gradient(
    to right,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.4) 50%,
    rgba(255, 255, 255, 0) 100%

.os.os-fullscreen .dock.dock-swipe .dock-edge-light{position: absolute;
  top: 4px;
  bottom: 4px;

  right: 0;

/* Hide any leftover button children if showDock toggled */
.os.os-fullscreen .dock.dock-swipe .dock-btn{display: none;}
/* qi 2026-05-17 8672 follow-up: "it isn't swiping"

   tap + vertical swipe-up. Horizontal drags pass through to .panes underneath. */
.os.os-fullscreen .dock.dock-swipe{pointer-events: none;}
.os.os-fullscreen .dock.dock-swipe .dock-handle,
.os.os-fullscreen .dock.dock-swipe .dock-sheen,
.os.os-fullscreen .dock.dock-swipe .dock-edge-light{pointer-events: none;}
/* THE GLASS IS THE SWIPE SURFACE (qi 2026-08-12 18:26: "if I swipe from the
   banner above each of the three panels that lets me swipe but that's the wrong
   surface — the swipe glass is literally called the swipe glass because it's
   supposed to do the swiping").

   WAS: clamp(160px,40vw,240px) x 44px pinned to top-center. The glass is
   full-width and ~84px tall, so MOST OF IT WAS DEAD TO TOUCH, and the strip
   that did respond handled vertical only (|dy|>|dx| → drawer). Horizontal was
   deliberately ignored, which is why the only thing that swiped panes was the
   banner above them.

   NOT a revert of the 2026-05-17 fix. That fix existed because the dock was
   SWALLOWING horizontal pane swipes, and simply turning pointer-events back on
   would re-break it. Instead the hit layer now covers the whole glass and the
   JS handler FORWARDS horizontal drags to the .panes scroller itself — the
   glass owns the gesture and the panes still move. Vertical-up still opens the
   drawer, so nothing he already relies on changes. */
.os.os-fullscreen .dock.dock-swipe .dock-hit{position: absolute;
  inset: 0;
  width: auto;
  height: auto;
  transform: none;
  pointer-events: auto;
  cursor: grab;
  background: transparent;

     axis — without this, the OS scroll steals horizontal drags on touch. */
  touch-action: none;
  -webkit-tap-highlight-color: transparent;}
.os.os-fullscreen .dock.dock-swipe .dock-hit:focus-visible{outline: 2px solid var(--accent);
  outline-offset: -4px;
  border-radius: 12px;}
/* DOCK NOTIFICATION TICKER — digital typing projection over the glass */
.os.os-fullscreen .dock-notif-ticker{position: absolute;
  left: 8%;
  right: 8%;
  /* THE NEGATIVE SPACE UNDER THE NOTIFICATIONS — qi 2026-08-13 22:05:
     "the notifications are now at the bottom of the swipe glass are canonically. so now
     that negative space under that must be eradicated."
     Notifications-at-the-bottom-of-the-glass is now CANON and is not what changes here.
     What changes is the empty band beneath them.

     MEASURED — the safe-area inset is counted THREE times on this bar:
       1. .dock.dock-swipe  min-height: calc(--dock-h + env(safe-area-inset-bottom))
       2. .dock.dock-swipe  padding-bottom: env(safe-area-inset-bottom)
       3. HERE              bottom: calc(env(safe-area-inset-bottom) + 6px)
     Count 3 is the one he is pointing at. This element is position:absolute, and absolute
     offsets resolve against the PADDING box — padding-bottom does not move it — so adding
     the inset here is pure duplication of count 2. On his handset (inset ≈ 34px) it floated
     the ticker 40px above the glass's bottom edge: 34px of that is the double-count, 6px is
     the intended breathing gap. That 40px band IS the negative space.

     Dropping to a flat 6px removes ONLY the duplicate. Deliberately NOT touched:
     min-height (count 1) and padding-bottom (count 2) — those set the glass's height and
     the wave/composer position, and qi 21:38/21:39 ("it looks taller", "over 70% of my
     swipe glass has been cut off") makes any height change to this bar a regression no
     matter what it fixes. One line, one cause, zero geometry moved.

     Verified live at 402x874: glass height unchanged at 60.44px, ticker bottom = 6px.
     The ~34px this reclaims is inset-dependent and therefore only visible on his handset. */
  bottom: 6px;
  display: flex;
  align-items: center;
  /* HORIZONTALLY CENTRED — qi 2026-08-13 22:37: "on a full screen view that's way to
     the left and that's not us, that's not a good look, that needs to be center."

     MEASURED at 402px wide before this: the ticker BOX was already symmetric (left:8%
     / right:8%, 33→369), but the content inside sat at 33→356 — hard against the left
     edge with 13px of slack on the right only. Two causes, and both are needed:
       1. no justify-content, so a flex row packs to flex-start;
       2. `.text { flex: 1}
.os.os-fullscreen .dock-notif-ticker.fading{opacity: 0;}
.os.os-fullscreen .dock-notif-ticker .dotglow{width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent), 0 0 12px var(--accent-dim);
  flex-shrink: 0;}
.os.os-fullscreen .dock-notif-ticker .text{overflow: hidden;
  text-overflow: ellipsis;
  /* THE OTHER HALF OF THE CENTRING. `flex: 1` made this fill the whole row, so the
     justify-content added above would have had nothing left to distribute — the group
     would still have started at the left edge. `0 1 auto` sizes it to its content
     (grow 0) while keeping shrink 1, so long text still collapses and ellipsises
     exactly as before; min-width:0 is what actually permits a flex item to shrink
     below its content width, without which the ellipsis never engages. */
  flex: 0 1 auto;
  min-width: 0;}
.os.os-fullscreen .dock-notif-ticker .caret{color: var(--accent);
  animation: dock-notif-blink 0.85s steps(1) infinite;
  text-shadow: 0 0 4px var(--accent);}
@keyframes dock-notif-blink{0%, 50% { opacity: 1;}
/* Source-color tint based on data-src */
.os.os-fullscreen .dock-notif-ticker[data-src="email"] .dotglow,
.os.os-fullscreen .dock-notif-ticker[data-src="email"] .text{color: #f9c47a;}
.os.os-fullscreen .dock-notif-ticker[data-src="beside"] .dotglow,
.os.os-fullscreen .dock-notif-ticker[data-src="beside"] .text{color: #7afff5;}
.os.os-fullscreen .dock-notif-ticker[data-src="whatsapp"] .dotglow,
.os.os-fullscreen .dock-notif-ticker[data-src="whatsapp"] .text{color: #5fe49b;}
/* ── VVSVEI MOUNTED IN-DOCUMENT AS THE MIDDLE PANEL ──────────────────────────
   The wrap is the panel; #xos-vei is the scope root every injected vvsvei
   selector was rewritten against, so it has to be the thing that owns the
   height — vvsvei's own layout is a flex column that fills its viewport, and
   here THIS is its viewport.
   It stops above the glass dock using the same token + 84px fallback as
   .xos-browser-overlay, so the composer never lands under the dock. */
.pane-vei{position:relative;overflow:hidden}

<div class="os os-fullscreen" id="os">

Canonical editable knowledge lives as Markdown in the M4 tree.
Databases are projections, never the only authoritative copy."></textarea>
        <div class="note-status">

<div class="adapters" id="adapters"></div>

<script>
/* ===========================================================================
   XOS runtime.  NO AUTH (section 1): open access, universal identity.
   Every external dependency is an ADAPTER that degrades cleanly when its
   credential is absent - a missing key must never blank the shell.
   =========================================================================== */
window.XOS_CONFIG = window.XOS_CONFIG || {
  identity:  'godmode-open',          // universal no-auth identity
  alias:     'life',                  // on xlrd.life, Xen is called 'life'
  omniSSE:   'https://omni.xlrd.org/sse-stream',
  eventsSSE: 'https://xen.xlrd.org/events',
  supabase:  { url:null, anonKey:null },   // absent -> local mode
  liveblocks:{ publicKey:null },           // absent -> single-user mode
};
var auth = { currentUser: function(){ return { id: XOS_CONFIG.identity, open:true }; } };

/* ---- adapter status: report the truth, never fake a connection ---- */
function paintAdapters(){
  var a=[
    ['omni',      !!XOS_CONFIG.omniSSE],
    ['akashic',   !!XOS_CONFIG.eventsSSE],
    ['supabase',  !!XOS_CONFIG.supabase.url],
    ['liveblocks',!!XOS_CONFIG.liveblocks.publicKey],
    ['capacitor', !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())]
  ];
  document.getElementById('adapters').innerHTML = a.map(function(x){
    return '<b class="'+(x[1]?'on':'off')+'">'+(x[1]?'\u25CF':'\u25CB')+' '+x[0]+'</b>';
  }).join('');
}
paintAdapters();
document.getElementById('whoami').textContent = XOS_CONFIG.alias;

/* ---- LEFT: omni inbox over the SSE rail that is proven live ---- */
var omniRows=[], omniFilter='';
function renderOmni(){
  var q=omniFilter.toLowerCase();
  var rows=omniRows.filter(function(r){
    return !q || ((r.title||'')+(r.text||'')+(r.network||'')).toLowerCase().indexOf(q)>=0;
  }).slice(0,300);
  document.getElementById('omni-count').textContent=rows.length+'/'+omniRows.length;
  document.getElementById('omni-list').innerHTML = rows.map(function(r){
    return '<div class="row"><div class="net">'+esc(r.networkLabel||r.network||'')+'</div>'+
           '<div class="who">'+esc(r.title||r.displayName||r.sender||'')+'</div>'+
           '<div class="prev">'+esc((r.text||'').slice(0,110))+'</div></div>';
  }).join('') || '<div class="prev">no rows yet</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

document.getElementById('omni-search').addEventListener('input',function(e){
  omniFilter=e.target.value; renderOmni();
});

(function connectOmni(){
  if(!XOS_CONFIG.omniSSE) return;
  try{
    var es=new EventSource(XOS_CONFIG.omniSSE);
    es.onmessage=function(ev){
      if(!ev.data) return;
      try{
        var o=JSON.parse(ev.data);
        if(o.messages && o.messages.length){ omniRows=o.messages; renderOmni(); }
      }catch(_){}
    };
    /* an empty onerror is how the last surface hid its own failure - report it */
    es.onerror=function(){
      document.getElementById('omni-count').textContent='reconnecting';
    };
  }catch(e){ document.getElementById('omni-count').textContent='unavailable'; }
})();

/* ---- CENTER: real editor, offline-first, autosave to localStorage ---- */
var NOTE_KEY='xos.notes.v1', notes=[], cur=0;
function loadNotes(){
  try{ notes=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'); }catch(_){ notes=[]; }
  if(!notes.length) notes=[{title:'untitled',body:'',ts:Date.now()}];
}
function saveNotes(state){
  try{ localStorage.setItem(NOTE_KEY,JSON.stringify(notes)); }catch(_){}
  var d=document.getElementById('save-dot'), t=document.getElementById('save-txt');
  d.className='dot '+(state||'saved'); t.textContent=state==='dirty'?'unsaved':'saved '+new Date().toLocaleTimeString();
}
function paintTabs(){
  document.getElementById('note-tabs').innerHTML=notes.map(function(n,i){
    return '<button class="note-tab'+(i===cur?' active':'')+'" data-i="'+i+'">'+esc(n.title||'untitled')+'</button>';
  }).join('')+'<button class="note-tab" data-new="1">+</button>';
  document.getElementById('note-count').textContent=notes.length;
}
function openNote(i){
  cur=i; paintTabs();
  document.getElementById('note-title').value=notes[i].title||'';
  document.getElementById('note-editor').value=notes[i].body||'';
}
document.getElementById('note-tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  if(b.dataset.new){ notes.push({title:'untitled',body:'',ts:Date.now()}); saveNotes(); openNote(notes.length-1); }
  else openNote(+b.dataset.i);
});
var saveTimer=null;
function touchNote(){
  notes[cur].title=document.getElementById('note-title').value;
  notes[cur].body=document.getElementById('note-editor').value;
  notes[cur].ts=Date.now();
  saveNotes('dirty');
  clearTimeout(saveTimer); saveTimer=setTimeout(function(){ saveNotes('saved'); },600);
}
document.getElementById('note-title').addEventListener('input',touchNote);
document.getElementById('note-editor').addEventListener('input',touchNote);
loadNotes(); openNote(0); saveNotes('saved');

/* ---- akashic live feed into the center status line ---- */
(function connectAkashic(){
  if(!XOS_CONFIG.eventsSSE) return;
  try{
    var es=new EventSource(XOS_CONFIG.eventsSSE), n=0;
    es.onmessage=function(ev){ if(ev.data){ n++;
      document.getElementById('akashic-txt').textContent='akashic: '+n+' events'; } };
    es.onerror=function(){ document.getElementById('akashic-txt').textContent='akashic: reconnecting'; };
  }catch(e){ document.getElementById('akashic-txt').textContent='akashic: unavailable'; }
})();

/* ---- OPHANIM: animated, watching. Canvas so there is no fake 3D asset. ---- */
(function ophanim(){
  var c=document.getElementById('oph-canvas'), x=c.getContext('2d'), t=0;
  var R=104, cx=R, cy=R;
  function frame(){
    t+=0.012; x.clearRect(0,0,c.width,c.height);
    /* concentric counter-rotating rings - the wheels-within-wheels reading */
    for(var r=0;r<4;r++){
      var rad=26+r*20, sp=(r%2?-1:1)*(0.5+r*0.22), a0=t*sp;
      x.beginPath();
      x.strokeStyle='rgba(60,255,150,'+(0.34-r*0.06)+')';
      x.lineWidth=1.2;
      for(var i=0;i<=64;i++){
        var a=a0+i/64*Math.PI*2;
        var wob=1+0.05*Math.sin(a*3+t*2+r);
        var px=cx+Math.cos(a)*rad*wob, py=cy+Math.sin(a)*rad*wob*0.86;
        i?x.lineTo(px,py):x.moveTo(px,py);
      }
      x.closePath(); x.stroke();
      /* the eye on each wheel */
      var ea=a0+t*0.6, ex=cx+Math.cos(ea)*rad, ey=cy+Math.sin(ea)*rad*0.86;
      x.beginPath(); x.arc(ex,ey,2.1,0,Math.PI*2);
      x.fillStyle='rgba(0,255,194,'+(0.85-r*0.14)+')'; x.fill();
    }
    /* core */
    var g=x.createRadialGradient(cx,cy,0,cx,cy,30);
    g.addColorStop(0,'rgba(0,255,194,0.5)'); g.addColorStop(1,'rgba(0,255,194,0)');
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,30,0,Math.PI*2); x.fill();
    requestAnimationFrame(frame);
  }
  frame();
  document.getElementById('ophanim').addEventListener('click',function(){
    document.getElementById('os').classList.toggle('oph-control');
    var s=document.getElementById('akashic-txt');
    s.textContent='ophanim: control '+(document.getElementById('os').classList.contains('oph-control')?'engaged':'released');
  });
})();

/* ---- mobile: swipe between panes (does not touch dock gesture logic) ---- */
(function paneSwipe(){
  var panes=['pane-left','pane-center','pane-right'], i=0, x0=null;
  function show(n){ i=Math.max(0,Math.min(2,n));
    panes.forEach(function(id,k){ document.getElementById(id).classList.toggle('active',k===i); }); }
  document.getElementById('panes').addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  document.getElementById('panes').addEventListener('touchend',function(e){
    if(x0==null)return; var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) show(i+(dx<0?1:-1)); x0=null; },{passive:true});
  if(matchMedia('(max-width:900px)').matches) show(0);
})();
